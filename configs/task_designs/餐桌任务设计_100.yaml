  notes: '背景摆放:花、水杯架

    1.勺子和叉子已装进布袋里,把手伸进袋里只靠指尖摸出勺子(勺窝的凹陷手感)和叉子(齿尖手感),摸到先别说出来

    2.把摸出的勺子放进金属碗,叉子放进陶瓷碗,拿出袋口的瞬间才用眼睛核对分类对不对

    3.分错的一件放回袋里重新摸,直到两件全部分对

    4.最后把手再伸回袋里确认袋里已经空了(指尖摸不到东西为止)

    5.两个碗并排摆到面前(O/K/P/L格),布袋叠好放右下角(F/C格)'
