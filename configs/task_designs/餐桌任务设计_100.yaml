- id: 1
  name: 餐桌_双手传递大碗
  category: 传递交换
  modalities:
  - 视觉
  - 触觉
  tactile: 托底感受重量与重心;水面平稳度;放碗先落底的手感
  difficulty: 中等
  background: 花、水杯架
  objects:
  - name: 大碗
    shape: cyl
    material: 陶瓷
    weight: 900
    dims:
      d: 24
      h: 9
  notes: '背景摆放:花、水杯架

    1.双手捧起大碗,一手托底一手扶沿,先在面前停一秒感受重量

    2.把大碗平稳传递到对侧席位(N/G格)放下,行走路径避开桌上其他物品,放下时先落底后松手

    3.再从对面把大碗端回面前(O/K/P/L格)

    4.全程碗里的水不洒出来(如有水面晃动,放慢脚步等水平稳再走)

    5.最后把大碗放回开局原位'
- id: 2
  name: 餐桌_削皮器削黄瓜
  category: 工具使用
  modalities:
  - 视觉
  - 触觉
  tactile: 刀口滑过与卡顿补削;黄瓜/胡萝卜硬度差异;左手反向操作
  difficulty: 中等
  background: 花、水杯架
  objects:
  - name: 黄瓜
    shape: cyl
    material: 食物
    weight: 200
    dims:
      d: 3.5
      h: 22
  - name: 削皮器
    shape: box
    material: 金属
    weight: 40
    dims:
      h: 1
      l: 12
      w: 6
  - name: 盘子
    shape: cyl
    material: 陶瓷
    weight: 300
    dims:
      d: 18
      h: 2
  notes: '背景摆放:花、水杯架

    1.左手竖握黄瓜中部,右手持削皮器贴住瓜身

    2.从上往下削出第一条皮,感到刀口顺畅滑过、皮条连成长条落下,皮直接削进盘子

    3.转动黄瓜逐条削,每条接上一条的边缘,削到整根露出浅色瓜肉

    4.摸一遍瓜身:有残留的深绿硬块(瓜刺疤)就是没削净的地方,重点补削(感到刀口卡顿)

    5.削净的黄瓜平放盘子,削皮器刀面朝下收好'
