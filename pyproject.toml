[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-brain-collect"
version = "1.1.0"
description = "Multi-modal data collection framework (Neon eye, cameras, EMG, gloves, position, markers)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The package is not installed; tests import it from the source tree.
pythonpath = ["src", "."]
markers = ["slow: needs the real session fixtures (decodes video)"]
